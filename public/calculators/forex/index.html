<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Averis Academy Forex Calculator</title>
    <link rel="stylesheet" href="styles.css?v=20260428" />

    <style>
      .rate-badge {
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.78em;
        margin-bottom: 8px;
        display: none;
      }
      .rate-ok {
        background: #1a3a1a;
        color: #4caf50;
        border: 1px solid #4caf50;
      }
      .rate-warn {
        background: #3a2a1a;
        color: #ff9800;
        border: 1px solid #ff9800;
      }
    </style>
  </head>
  <body>
    <div class="calculator-container">
      <h1>Averis Academy Forex Calculator</h1>
      <p class="subtitle">Calculate your position size based on risk</p>
      <div id="rateBadge" class="rate-badge"></div>
      <a
        href="/syntheticscalculator"
        class="nav-link-btn"
        target="_top"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3h7v7H3z" />
          <path d="M14 3h7v7h-7z" />
          <path d="M14 14h7v7h-7z" />
          <path d="M3 14h7v7H3z" />
        </svg>
        Switch to Indices Calculator
      </a>

      <!-- Mode Switch: Pips vs Price -->
      <div class="mode-switch-wrapper">
        <span class="mode-label" id="modeLabelPips">Pips Mode</span>
        <div class="mode-switch-track" id="modeSwitchTrack">
          <div class="mode-switch-thumb" id="modeSwitchThumb"></div>
        </div>
        <span class="mode-label" id="modeLabelPrice">Price Mode</span>
      </div>
      <p class="mode-description" id="modeDescription">
        Enter stop loss in pips
      </p>

      <form id="forexForm">
        <div class="form-group">
          <label for="tradingPair">Trading Instrument</label>
          <select id="tradingPair" required>
            <option value="">Select an instrument...</option>

            <optgroup label="Commodities &amp; Crypto">
              <option value="GOLD">GOLD (XAU/USD)</option>
              <option value="BTC">Bitcoin (BTC)</option>
              <option value="ETH">Ethereum (ETH)</option>
              <option value="OIL">Oil</option>
            </optgroup>

            <optgroup label="Indices">
              <option value="NAS100">NASDAQ 100</option>
              <option value="US30">US30 (Dow Jones)</option>
              <option value="GER40">GER40 (DAX)</option>
            </optgroup>

            <optgroup label="USD Pairs (USD quote)">
              <option value="CURRENCY_USD">
                EUR/USD, GBP/USD, AUD/USD, NZD/USD…
              </option>
            </optgroup>

            <optgroup label="JPY Pairs">
              <option value="CURRENCY_JPY">USD/JPY, EUR/JPY, GBP/JPY…</option>
            </optgroup>

            <optgroup label="USD Base (non-USD quote)">
              <option value="USD_CHF">USD/CHF</option>
              <option value="USD_CAD">USD/CAD</option>
            </optgroup>

            <optgroup label="EUR Cross Pairs">
              <option value="EUR_GBP">EUR/GBP</option>
              <option value="EUR_AUD">EUR/AUD</option>
              <option value="EUR_CAD">EUR/CAD</option>
              <option value="EUR_CHF">EUR/CHF</option>
              <option value="EUR_NZD">EUR/NZD</option>
            </optgroup>

            <optgroup label="GBP Cross Pairs">
              <option value="GBP_AUD">GBP/AUD</option>
              <option value="GBP_CAD">GBP/CAD</option>
              <option value="GBP_CHF">GBP/CHF</option>
              <option value="GBP_NZD">GBP/NZD</option>
            </optgroup>

            <optgroup label="AUD / NZD / CAD Cross Pairs">
              <option value="AUD_CAD">AUD/CAD</option>
              <option value="AUD_CHF">AUD/CHF</option>
              <option value="AUD_NZD">AUD/NZD</option>
              <option value="NZD_CAD">NZD/CAD</option>
              <option value="NZD_CHF">NZD/CHF</option>
              <option value="CAD_CHF">CAD/CHF</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label for="accountSize">Account Size (USD)</label>
          <div class="input-icon">
            <input
              type="number"
              id="accountSize"
              step="0.01"
              min="0"
              placeholder="Enter your account balance"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Risk Type</label>
          <div class="toggle-container">
            <span class="toggle-label" id="riskLabelPct">Percentage (%)</span>
            <div class="toggle-wrapper">
              <div class="mode-switch-track" id="riskSwitchTrack">
                <div class="mode-switch-thumb"></div>
              </div>
            </div>
            <span class="toggle-label" id="riskLabelFixed"
              >Fixed Amount ($)</span
            >
          </div>
        </div>

        <div class="form-group">
          <label for="riskValue">
            Risk Amount
            <span class="risk-type-display" id="riskTypeDisplay">%</span>
          </label>
          <input
            type="number"
            id="riskValue"
            step="0.01"
            min="0"
            placeholder="Enter risk amount"
            required
          />
        </div>

        <!-- PIPS MODE fields -->
        <div id="pipsModeFields">
          <div class="form-group">
            <label for="slPips">Stop Loss (Pips)</label>
            <input
              type="number"
              id="slPips"
              step="0.1"
              min="0.1"
              placeholder="Enter stop loss in pips"
            />
          </div>
        </div>

        <!-- PRICE MODE fields -->
        <div id="priceModeFields" class="hidden">
          <div class="form-group">
            <label for="entryPrice">Entry Price</label>
            <input
              type="number"
              id="entryPrice"
              step="0.00001"
              min="0"
              placeholder="Enter entry price"
            />
          </div>
          <div class="form-group">
            <label for="stopLossPrice">Stop Loss Price</label>
            <input
              type="number"
              id="stopLossPrice"
              step="0.00001"
              min="0"
              placeholder="Enter stop loss price"
            />
          </div>
        </div>

        <button type="submit" class="calculate-btn">Calculate Lot Size</button>
      </form>

      <div class="result-container" id="resultContainer">
        <div class="instrument-badge" id="instrumentBadge"></div>

        <!-- Price mode extra rows -->
        <div id="priceResultRows" class="hidden">
          <div class="result-row">
            <span class="result-label">Price Difference</span>
            <span class="result-value" id="priceDiff">0.00</span>
          </div>
          <div class="result-row">
            <span class="result-label">Derived SL (Pips)</span>
            <span class="result-value" id="derivedPips">0.00</span>
          </div>
        </div>

        <div class="result-row">
          <span class="result-label">Risk Amount ($)</span>
          <span class="result-value" id="riskAmountDisplay">$0.00</span>
        </div>

        <div class="lot-size-highlight">
          <div class="lot-size-label">Recommended Lot Size</div>
          <div class="lot-size-value">
            <span id="lotSize">0.00</span>
            <span class="lot-size-unit">lots</span>
          </div>
        </div>
        <div
          id="crossRateNote"
          style="display: none; font-size: 0.8em; opacity: 0.7; margin-top: 8px"
        ></div>
      </div>
    </div>

    <script src="script.js?v=20260428"></script>
  </body>
</html>
